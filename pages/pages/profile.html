<!DOCTYPE html>
<html lang="vi">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Sửa lại đường dẫn lùi 2 cấp đến style.css ở thư mục gốc -->
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="associate-zone-view.html" class="brand-logo">👷 SmartShelf</a>
      <a href="associate-zone-view.html" class="btn btn-outline">⬅️ Quay về Vận hành</a>
    </div>
  </header>

  <main class="container" style="max-width: 500px; margin-top: 40px;">
    <div class="search-hero" style="padding: 28px; text-align: center;">
      <div style="font-size: 4rem;">👷‍♂️</div>
      <h2 style="font-size: 1.4rem; font-weight: 800; margin-top: 8px;">Nguyễn Văn Nhân Viên</h2>

      </div>

      <!-- HÀM ĐĂNG XUẤT: Xóa người dùng khỏi LocalStorage và lùi 2 cấp về login.html -->
      <button onclick="localStorage.removeItem('smartshelf_user'); window.location.href='../../login.html';" class="btn btn-outline" style="width: 100%; margin-top: 24px; color: var(--danger-text); border-color: var(--danger-bg);">
        🚪 Đăng xuất khỏi hệ thống
      </button>
    </div>
  </main>
